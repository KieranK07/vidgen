[project]
name = "vidgen"
version = "0.1.0"
description = "Local, Metal-native video + image generation queue and dashboard for Apple Silicon"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-multipart>=0.0.9",
    "psutil>=5.9",
    "pillow>=10.0",
]

[project.optional-dependencies]
# The model stacks. Kept optional so the service and its tests can run on a
# machine without the weights, and so you can upgrade them independently.
models = [
    "mlx-video @ git+https://github.com/Blaizzy/mlx-video.git",
    "mflux>=0.9",
]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
vidgen = "vidgen.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vidgen*"]

[tool.setuptools.package-data]
vidgen = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
